<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <style>
        header {
            background-color: #103F70;
            color: #EAF0F4;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #EAF0F4;
            color: #103F70;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
             display: flex;
         }
        /* Alterado de 'image' para 'img' */
        img {
            width: 50px;
            height: 50px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>vou compartilhar sobre minha vida pessoal para vcs se inspirar em mim</p>
    </header>
    <main>
        <article>
            <img src="Gemini_Generated_Image_f606inf606inf606.png"
                alt="apresentando minha história de vida, experiências, momentos importantes e trajetória pessoal compartilhada no blogem tom azul escuro.">
            <div>
                <h2>meu primeiro post</h2>
                <p class="artigo-autor">Por: Camila</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar sobre mim.</p>
                <button>💗 <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
        <article>
            <img src="Gemini_Generated_Image_f606inf606inf606.png"
                alt="apresentando minha história de vida, experiências, momentos importantes e trajetória pessoal compartilhada no blogem tom azul escuro.">
            <div>
                <h2>meu segundo post</h2>
                <p class="artigo-autor">Por: Camila</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar sobre mim.</p>
                <button>💗 <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false){
                texto.textContent++;
                curtiu = true;
            } else{
                texto.textContent--;
                curtiu = false;
            }
        }
    })

</script>

</html>
